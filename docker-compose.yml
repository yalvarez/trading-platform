services:
  # =========================
  redis:
    image: redis:7-alpine
    container_name: atp-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  # =========================
  mt5_acct1:
    image: gmag11/metatrader5_vnc:latest
    container_name: atp-mt5-acct1
    environment:
      - CUSTOM_USER=${MT5_WEB_USER}
      - PASSWORD=${MT5_WEB_PASS}
    ports:
      - "3001:3000"
      - "8001:8001"
    volumes:
      - mt5_acct1_config:/config
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8001"]
      interval: 5s
      timeout: 2s
      retries: 10

  telegram_ingestor:
    build:
      context: .
      dockerfile: services/telegram_ingestor/Dockerfile
    container_name: atp-telegram-ingestor
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./services/telegram_ingestor/telegram_ingestor.session:/app/services/telegram_ingestor/telegram_ingestor.session:rw
    ports:
      - "8000:8000"

  router_parser:
    build:
      context: .
      dockerfile: services/router_parser/Dockerfile
    container_name: atp-router-parser
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  trade_orchestrator:
    build:
      context: .
      dockerfile: services/trade_orchestrator/Dockerfile
    container_name: atp-trade-orchestrator
    env_file:
      - .env
    depends_on:
      mt5_acct1:
        condition: service_started
      redis:
        condition: service_healthy

    restart: unless-stopped
    volumes:
      - ./services/telegram_ingestor/telegram_ingestor.session:/app/services/telegram_ingestor/telegram_ingestor.session:rw
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /tmp/telegram_notifier.ready"]
      interval: 10s
      timeout: 5s
      retries: 6

  trade_api:
    build:
      context: .
      dockerfile: services/trade_api/Dockerfile
    container_name: atp-trade-api
    env_file:
      - .env
    ports:
      - "8100:8100"
    depends_on:
      mt5_acct1:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  mt5_acct1_config:
