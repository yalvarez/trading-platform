services:
  # =========================
  redis:
    image: redis:7-alpine
    container_name: atp-redis
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  # =========================
  mt5_acct1:
    image: gmag11/metatrader5_vnc:2.3
    container_name: atp-mt5-acct1
    environment:
      - CUSTOM_USER=${MT5_WEB_USER}
      - PASSWORD=${MT5_WEB_PASS}
    ports:
      - "3001:3000"
      - "9081:8001"
    volumes:
      - mt5_acct1_config:/config
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8001"]
      interval: 5s
      timeout: 2s
      retries: 10
    # NOTA: la imagen instala la version mas reciente de mt5linux (Linux side)
    # sin fijar version, y mt5linux>=1.1.0 usa sintaxis de f-string (PEP 701)
    # que rompe con el Python 3.11 de esta imagen (SyntaxError: unterminated
    # string literal en metatrader5.py, mt5.copy_rates_from). Ademas,
    # mt5linux>=1.1.0 arrastra rpyc>=6.0, que no es compatible en protocolo
    # con el rpyc que usan los clientes (trade_orchestrator/trade_api,
    # via mt5linux==0.1.9) — un desajuste de rpyc entre cliente y servidor
    # rompe el handshake RPyC incluso si solo se arregla mt5linux de un lado
    # (sintomas: ValueError en brine.load, o TimeoutError: result expired,
    # en vez de un error de conexion claro).
    #
    # Se corrigio manualmente instalando, en AMBOS lados del contenedor
    # (Linux y Wine/Windows — el arranque de la imagen instala mt5linux por
    # separado en cada uno), las mismas versiones que usan
    # trade_orchestrator/trade_api:
    #   mt5linux==0.1.9
    #   rpyc==5.0.1
    # dentro del volumen persistente mt5_acct1_config. El script de arranque
    # de la imagen NUNCA reinstala si detecta que mt5linux ya esta instalado
    # (cualquier version), asi que este fix sobrevive reinicios normales del
    # contenedor. Si el volumen mt5_acct1_config se borra o se recrea desde
    # cero (docker compose down -v, o un volumen nuevo), hay que re-aplicar
    # el fix una vez — ver scripts/fix-mt5-linux-version.sh, que automatiza
    # ambos lados (Linux + Wine) y ambos paquetes (mt5linux + rpyc).

  telegram_ingestor:
    build:
      context: .
      dockerfile: services/telegram_ingestor/Dockerfile
    container_name: atp-telegram-ingestor
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./services/telegram_ingestor/telegram_ingestor.session:/app/services/telegram_ingestor/telegram_ingestor.session:rw
    ports:
      - "8070:8000"

  router_parser:
    build:
      context: .
      dockerfile: services/router_parser/Dockerfile
    container_name: atp-router-parser
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  trade_orchestrator:
    build:
      context: .
      dockerfile: services/trade_orchestrator/Dockerfile
    container_name: atp-trade-orchestrator
    env_file:
      - .env
    depends_on:
      mt5_acct1:
        condition: service_started
      redis:
        condition: service_healthy

    restart: unless-stopped
    volumes:
      - ./services/telegram_ingestor/telegram_ingestor.session:/app/services/telegram_ingestor/telegram_ingestor.session:rw
      - ./data/trade_state.jsonl:/app/data/trade_state.jsonl:rw
    ports:
      - "8200:8200"

  trade_api:
    build:
      context: .
      dockerfile: services/trade_api/Dockerfile
    container_name: atp-trade-api
    env_file:
      - .env
    ports:
      - "8100:8100"
    depends_on:
      mt5_acct1:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  mt5_acct1_config:
