[supervisord]
logfile=/app/supervisord.log
logfile_maxbytes=50MB
logfile_backups=2
loglevel=info
nodaemon=true

[program:ingestor]
command=python app.py
autostart=true
autorestart=true
; Nunca dar el ingestor por perdido: con el default (startretries=3) tres
; arranques fallidos seguidos (Redis/Telegram aun no disponibles tras un
; reinicio del host) lo dejaban en FATAL para siempre mientras el contenedor
; seguia "Up" (incidente 2026-09-07). supervisord espera 1s, 2s, 3s... entre
; reintentos. startsecs=10: solo cuenta como arrancado si sigue vivo 10s.
startretries=1000000
startsecs=10
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
stdout_logfile_backups=0
stderr_logfile_backups=0
